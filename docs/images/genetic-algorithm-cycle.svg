<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Genetic algorithm cycle">
  <rect width="1000" height="620" fill="#0b1020"/>
  <text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="32" fill="#ffffff" font-weight="700">Genetic Algorithm Cycle</text>
  <text x="500" y="86" text-anchor="middle" font-family="Arial" font-size="16" fill="#b7c4d6">Population-based search inspired by evolutionary optimisation</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#8ff0c6"/>
    </marker>
  </defs>

  <g font-family="Arial" font-size="18" fill="#0b1020" font-weight="700">
    <rect x="390" y="130" width="220" height="58" rx="16" fill="#8ff0c6"/>
    <text x="500" y="166" text-anchor="middle">Initial population</text>

    <rect x="670" y="265" width="220" height="58" rx="16" fill="#ffd27a"/>
    <text x="780" y="301" text-anchor="middle">Fitness evaluation</text>

    <rect x="390" y="430" width="220" height="58" rx="16" fill="#d7b9ff"/>
    <text x="500" y="466" text-anchor="middle">Selection</text>

    <rect x="110" y="265" width="220" height="58" rx="16" fill="#7be0ff"/>
    <text x="220" y="301" text-anchor="middle">Crossover and mutation</text>
  </g>

  <g stroke="#8ff0c6" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M610 160 C760 170 835 210 810 265"/>
    <path d="M780 323 C750 410 655 455 610 459"/>
    <path d="M390 459 C240 440 165 370 190 323"/>
    <path d="M220 265 C250 185 340 155 390 160"/>
  </g>

  <rect x="190" y="540" width="620" height="44" rx="14" fill="#111a2e" stroke="#8ff0c6"/>
  <text x="500" y="568" text-anchor="middle" font-family="Arial" font-size="16" fill="#ffffff">Repeat until a stopping rule is met: target score, generation limit, or convergence.</text>
</svg>
