<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Neural network family diagram">
  <rect width="1200" height="650" fill="#0b1020"/>
  <text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="32" fill="#ffffff" font-weight="700">Neural-Network Family</text>
  <text x="600" y="82" text-anchor="middle" font-family="Arial" font-size="16" fill="#b7c4d6">Different architectures match different data structures and learning objectives</text>

  <rect x="490" y="120" width="220" height="58" rx="14" fill="#a7c7e7"/>
  <text x="600" y="156" text-anchor="middle" font-family="Arial" font-size="20" fill="#0b1020" font-weight="700">Neural Networks</text>

  <g stroke="#69a7ff" stroke-width="3" fill="none">
    <line x1="600" y1="178" x2="180" y2="245"/>
    <line x1="600" y1="178" x2="390" y2="245"/>
    <line x1="600" y1="178" x2="600" y2="245"/>
    <line x1="600" y1="178" x2="810" y2="245"/>
    <line x1="600" y1="178" x2="1020" y2="245"/>
  </g>

  <g font-family="Arial" font-size="16">
    <rect x="70" y="245" width="220" height="80" rx="14" fill="#1e2a44" stroke="#a7c7e7"/>
    <text x="180" y="278" text-anchor="middle" fill="#ffffff" font-weight="700">FFNN</text>
    <text x="180" y="305" text-anchor="middle" fill="#b7c4d6">tabular / nonlinear</text>

    <rect x="280" y="245" width="220" height="80" rx="14" fill="#1e2a44" stroke="#a7c7e7"/>
    <text x="390" y="278" text-anchor="middle" fill="#ffffff" font-weight="700">RNN / LSTM</text>
    <text x="390" y="305" text-anchor="middle" fill="#b7c4d6">sequential data</text>

    <rect x="490" y="245" width="220" height="80" rx="14" fill="#1e2a44" stroke="#a7c7e7"/>
    <text x="600" y="278" text-anchor="middle" fill="#ffffff" font-weight="700">CNN</text>
    <text x="600" y="305" text-anchor="middle" fill="#b7c4d6">spatial / image data</text>

    <rect x="700" y="245" width="220" height="80" rx="14" fill="#1e2a44" stroke="#a7c7e7"/>
    <text x="810" y="278" text-anchor="middle" fill="#ffffff" font-weight="700">GAN</text>
    <text x="810" y="305" text-anchor="middle" fill="#b7c4d6">generative modelling</text>

    <rect x="910" y="245" width="220" height="80" rx="14" fill="#1e2a44" stroke="#a7c7e7"/>
    <text x="1020" y="278" text-anchor="middle" fill="#ffffff" font-weight="700">BERT / XLNet</text>
    <text x="1020" y="305" text-anchor="middle" fill="#b7c4d6">language context</text>
  </g>

  <g font-family="Arial" font-size="15" fill="#ffffff">
    <rect x="75" y="390" width="1050" height="155" rx="20" fill="#111a2e" stroke="#69a7ff"/>
    <text x="110" y="430">• FFNN: one-directional feature transformation and prediction.</text>
    <text x="110" y="465">• RNN/LSTM: memory for temporal/sequential data; LSTM adds gates for longer dependencies.</text>
    <text x="110" y="500">• CNN: local connections and weight sharing for spatial patterns such as images.</text>
    <text x="620" y="430">• GAN: generator and discriminator improve through competition.</text>
    <text x="620" y="465">• BERT-style models: bidirectional contextual representation.</text>
    <text x="620" y="500">• XLNet-style models: permutation-based autoregressive context modelling.</text>
  </g>
</svg>
