<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="AI computational methods taxonomy overview">
  <rect width="1200" height="760" fill="#0b1020"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#ffffff" font-weight="700">AI Computational Methods</text>
  <text x="600" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#b7c4d6">From knowledge-driven reasoning to data-driven learning and optimisation</text>

  <rect x="455" y="125" width="290" height="58" rx="16" fill="#a7c7e7"/>
  <text x="600" y="162" text-anchor="middle" font-family="Arial" font-size="20" fill="#0b1020" font-weight="700">Computational Methods</text>

  <line x1="600" y1="183" x2="250" y2="240" stroke="#69a7ff" stroke-width="4"/>
  <line x1="600" y1="183" x2="600" y2="240" stroke="#69a7ff" stroke-width="4"/>
  <line x1="600" y1="183" x2="950" y2="240" stroke="#69a7ff" stroke-width="4"/>

  <rect x="95" y="240" width="310" height="58" rx="14" fill="#b7f5d1"/>
  <text x="250" y="276" text-anchor="middle" font-family="Arial" font-size="19" fill="#0b1020" font-weight="700">Knowledge-driven AI</text>

  <rect x="445" y="240" width="310" height="58" rx="14" fill="#ffe2a8"/>
  <text x="600" y="276" text-anchor="middle" font-family="Arial" font-size="19" fill="#0b1020" font-weight="700">Data-driven ML</text>

  <rect x="795" y="240" width="310" height="58" rx="14" fill="#d7b9ff"/>
  <text x="950" y="276" text-anchor="middle" font-family="Arial" font-size="19" fill="#0b1020" font-weight="700">Optimisation & Adaptation</text>

  <g font-family="Arial" font-size="16" fill="#ffffff">
    <rect x="115" y="340" width="270" height="42" rx="10" fill="#1e2a44" stroke="#b7f5d1"/>
    <text x="250" y="367" text-anchor="middle">Ontology</text>
    <rect x="115" y="395" width="270" height="42" rx="10" fill="#1e2a44" stroke="#b7f5d1"/>
    <text x="250" y="422" text-anchor="middle">Knowledge graph</text>
    <rect x="115" y="450" width="270" height="42" rx="10" fill="#1e2a44" stroke="#b7f5d1"/>
    <text x="250" y="477" text-anchor="middle">Semantic triples</text>
    <rect x="115" y="505" width="270" height="42" rx="10" fill="#1e2a44" stroke="#b7f5d1"/>
    <text x="250" y="532" text-anchor="middle">Logic and reasoning</text>

    <rect x="465" y="340" width="270" height="42" rx="10" fill="#1e2a44" stroke="#ffe2a8"/>
    <text x="600" y="367" text-anchor="middle">Decision tree / Random forest</text>
    <rect x="465" y="395" width="270" height="42" rx="10" fill="#1e2a44" stroke="#ffe2a8"/>
    <text x="600" y="422" text-anchor="middle">Regression and classification</text>
    <rect x="465" y="450" width="270" height="42" rx="10" fill="#1e2a44" stroke="#ffe2a8"/>
    <text x="600" y="477" text-anchor="middle">KNN and Naive Bayes</text>
    <rect x="465" y="505" width="270" height="42" rx="10" fill="#1e2a44" stroke="#ffe2a8"/>
    <text x="600" y="532" text-anchor="middle">Neural networks</text>

    <rect x="815" y="340" width="270" height="42" rx="10" fill="#1e2a44" stroke="#d7b9ff"/>
    <text x="950" y="367" text-anchor="middle">Transfer learning</text>
    <rect x="815" y="395" width="270" height="42" rx="10" fill="#1e2a44" stroke="#d7b9ff"/>
    <text x="950" y="422" text-anchor="middle">Genetic algorithm</text>
    <rect x="815" y="450" width="270" height="42" rx="10" fill="#1e2a44" stroke="#d7b9ff"/>
    <text x="950" y="477" text-anchor="middle">Simulated annealing</text>
    <rect x="815" y="505" width="270" height="42" rx="10" fill="#1e2a44" stroke="#d7b9ff"/>
    <text x="950" y="532" text-anchor="middle">Swarm intelligence</text>
  </g>

  <rect x="150" y="630" width="900" height="70" rx="16" fill="#111a2e" stroke="#69a7ff" stroke-width="2"/>
  <text x="600" y="660" text-anchor="middle" font-family="Arial" font-size="17" fill="#ffffff" font-weight="700">Practical selection principle</text>
  <text x="600" y="685" text-anchor="middle" font-family="Arial" font-size="15" fill="#b7c4d6">Choose the method family based on knowledge availability, data availability, explainability needs, and computational constraints.</text>
</svg>
